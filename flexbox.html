<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: black;
      }
      .cointainer {
        border: 2px solid red;
        height: 500px;
        width: 500px;
        display: flex;
        flex-direction: row;
        justify-content: start;
        align-items: start;
        gap: 20px;
      }
      .box {
        width: 100px;
        height: 100px;
        background-color: burlywood;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
      }
    </style>
  </head>
  <body>
    <div class="cointainer">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
    </div>
  </body>
</html>
